apiVersion: apps/v1
kind: Deployment
metadata: 
  name: backend-dep
  namespace: three-tier
  labels:
    app: backend

spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend

  template: 
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: three-tier-app
          image: abhimaske/backend-image:latest
          imagePullPolicy: Always

          env:
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-secrets
                  key: username
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-secrets
                  key: password

          ports:
            - containerPort: 3500

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          startupProbe:
            httpGet:
              path: /ok
              port: 3500
            failureThreshold: 30
            periodSeconds: 10     

          livenessProbe: 
            httpGet:
              path: /ok
              port: 3500
            initialDelaySeconds: 25
            periodSeconds: 20

          readinessProbe:
            httpGet:
              path: /ok
              port: 3500
            initialDelaySeconds: 20
            periodSeconds: 10

