apiVersion: apps/v1
kind: Deployment

metadata:
 name: mongo-dep
 namespace: three-tier
 labels:
   app: mongodb

spec:
  replicas: 2
  selector:
    matchLabels:
      app: mongodb

  template:
    metadata:
      name: mongo-pod
      namespace: three-tier
      labels:
        app: mongodb


    spec:
      containers:
       - name: mongo
         image: mongo:4.4.6
         ports:
          - containerPort: 27017
         env:
           - name: MONGO_INITDB_ROOT_USERNAME
             valueFrom:
               secretKeyRef:
                 name: mongo-secrets
                 key: username
 
           - name: MONGO_INITDB_ROOT_PASSWORD
             valueFrom:
               secretKeyRef:
                  name: mongo-secrets
                  key: password       
         
         volumeMounts:
            - name: mongo-data
              mountPath: /data/db
     
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: mongo-pvc  
   

